name: keycloak-large-jwt-demo
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--hostname=http://localhost:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  seed:
    image: python:3.13-alpine
    environment:
      KC_INTERNAL_URL: http://keycloak:8080
      KC_ADMIN_USERNAME: admin
      KC_ADMIN_PASSWORD: admin
      AUTHZ_CLIENT_SECRET: demo-authz-secret
      SYNTHETIC_ROLES: "450"
    volumes:
      - ./seed:/seed:ro
    command: ["python", "-u", "/seed/seed.py"]
    depends_on:
      - keycloak
    restart: "no"

  api:
    build: .
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_EXTERNAL_URL: http://localhost:8080
      AUTHZ_CLIENT_SECRET: demo-authz-secret
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  keycloak-data:
